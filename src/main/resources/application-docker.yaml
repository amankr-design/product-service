spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://mysql:3306/productdb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cache:
    type: redis
  data:
    redis:
      host: redis
      port: 6379

jwt:
  secret: mySecretKeyForJwtAuthentication12345678901234567890
  expiration: 86400000

server:
  port: 8081